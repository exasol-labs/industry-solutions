services:
  process-mining:
    build: .
    image: process-mining-web:latest
    container_name: process-mining-web
    # tini as PID 1 → clean signal handling / no zombie processes.
    init: true
    restart: unless-stopped
    # Host ports are offset by +10000 from the container ports (e.g. 18080→8080) so
    # they don't clash with other local services — notably phpldapadmin on host 8080.
    # (The former +2000 offset landed the app on host port 10080, which Chrome,
    # Firefox and Safari BLOCK as a restricted port — never map to 10080.)
    ports:
      - "18080:8080"   # main application (HTTP)
      - "18443:8443"   # main application (HTTPS — active once TLS is enabled in admin)
      - "18090:8090"   # admin interface (HTTP)
      - "18453:8453"   # admin interface (HTTPS — active once TLS is enabled in admin)
      - "18100:8100"   # integration console (HTTP — power users / developers / admins)
      - "18463:8463"   # integration console (HTTPS — active once TLS is enabled in admin)
      - "18110:8110"   # Actions surface (HTTP — developers / admins; off until enabled in admin)
      - "18473:8473"   # Actions surface (HTTPS — active once TLS is enabled in admin)
      # API Server - Event Receiver pool — one server per configured sink (HTTP 8120–8129,
      # HTTPS 8483–8492). A fixed pre-exposed pool because Docker can't publish ranges
      # dynamically; a sink picks a free port from it. Off until enabled in admin.
      - "18120-18129:8120-8129"   # sink ingestion servers (HTTP)
      - "18483-18492:8483-8492"   # sink ingestion servers (HTTPS — per TLS mode)
      - "18130:8130"   # MCP server (HTTP — AI clients query process data over MCP; off until enabled)
      - "18493:8493"   # MCP server (HTTPS — active once TLS is enabled in admin)
    environment:
      # First-run bootstrap admin — override the default password (recommended).
      # PMW_DEFAULT_ADMIN_USER: "Administrator"
      # PMW_DEFAULT_ADMIN_PASSWORD: "change-me"
      # Session lifetimes, query timeout, etc. can also be set here (see README).
      PMW_DATA_DIR: /app/data
    volumes:
      # Persisted state (settings.sqlite3, security.sqlite3, secret.key, certs/,
      # gui.pid) — stored in ./data relative to this compose file.
      - ./data:/app/data

    # ── Auto-rebuild on source changes (Compose Watch, Docker Compose ≥ 2.22) ──
    #
    # `docker compose watch` (or `docker compose up --watch`) monitors these
    # paths and rebuilds the image whenever any of them change. The build itself
    # is cheap when nothing relevant changed, because Docker's layer cache is the
    # actual "does this need rebuilding?" check — untouched layers are reused, so
    # only the parts affected by the change are rebuilt.
    develop:
      watch:
        # Backend / admin / integration / actions / GUI Python sources → rebuild.
        - path: ./backend
          action: rebuild
        - path: ./admin
          action: rebuild
        - path: ./integration
          action: rebuild
        - path: ./actions
          action: rebuild
        - path: ./sink
          action: rebuild
        # Frontend (Python launcher + React SPA); node_modules/dist are outputs.
        - path: ./frontend
          action: rebuild
          ignore:
            - node_modules/
            - dist/
        # Training guides served at /guides/… by the GUI server.
        - path: ./docs
          action: rebuild
        # Dependency / build / entrypoint definitions.
        - path: ./requirements.txt
          action: rebuild
        - path: ./run.sh
          action: rebuild
        - path: ./Dockerfile
          action: rebuild
